# This is a Declarative Automation Bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: fb7dcd46-fb5f-443f-9289-ac8d14f8a65b

include:
  - resources/*.yml 
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}_
      source_linked_deployment: false
    workspace:
      host: https://dbc-50407178-1622.cloud.databricks.com
    

  prod:
    mode: production
    workspace:
      host: dbc-50407178-1622.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/subratdey85@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/subratdey85@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    
    permissions:
      - group_name: admins
        level: CAN_MANAGE
